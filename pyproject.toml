[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-search"
version = "0.1.0"
description = "Multi-source academic literature search agent skill"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "literature-search contributors"}
]
keywords = [
    "agent-skill",
    "literature-search",
    "academic",
    "arxiv",
    "semantic-scholar"
]
dependencies = [
    "requests",
    "feedparser"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
literature-search = "literature_search.combined_search:main"

[tool.setuptools.packages.find]
where = ["python"]
